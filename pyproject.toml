[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kyklos"
dynamic = ["version"]
description = "Python package for orbital mechanics and satellite mission design"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Shane Billingsley"},
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "pandas>=2.0",
    "plotly>=6.0",
    # heyoka.py must be installed via conda:
    #   conda install -c conda-forge heyoka.py
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "jupyter",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]

# Single source of truth: __version__ in src/kyklos/__init__.py.
# Setuptools reads the literal without importing the package (which would
# require Heyoka at build time).
[tool.setuptools.dynamic]
version = {attr = "kyklos.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: requires a compiled Heyoka integrator; deselect with -m 'not slow'",
]
addopts = "--strict-markers"